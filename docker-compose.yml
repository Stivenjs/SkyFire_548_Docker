services:
  mysql:
    image: mysql:8.4
    container_name: skyfire-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: auth
      MYSQL_USER: ${SKYFIRE_DB_USER:-skyfire}
      MYSQL_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}

    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    networks:
      - skyfire

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  db-init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-db-init
    restart: "no"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      REALM_NAME: ${REALM_NAME:-SkyFire 5.4.8}
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      REALM_PORT: ${REALM_PORT:-8085}
      SKYFIRE_REF: ${SKYFIRE_REF:-main}
      SFDB_DOWNLOAD_URL: ${SFDB_DOWNLOAD_URL:-}

    volumes:
      - ./scripts:/scripts:ro
      - db_cache:/database_cache
      - ./database:/local_sql:ro

    networks:
      - skyfire

    entrypoint: ["/bin/bash", "/scripts/db-init.sh"]

  extractor:
    profiles: ["tools"]
    image: skyfire548-server:latest
    container_name: skyfire-extractor
    volumes:
      - "${CLIENT_PATH:-D:/MoP/MOP-5.4.8.18414-enUS-Repack}:/client"
      - "./data/server/game-data:/data"
      - extractor_workspace:/workspace
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BINS=/opt/skyfire-server/bin

        echo "=========================================="
        echo "  SkyFire 5.4.8 — Extracción completa"
        echo "=========================================="

        # Prepare a writable workspace with symlinks to client data
        mkdir -p /workspace
        ln -sfn /client/Data /workspace/Data 2>/dev/null || true

        # ── Step 1: Maps + DBC ──────────────────────
        if [ -d "/data/maps" ] && [ "$$(ls -A /data/maps 2>/dev/null)" ]; then
          echo "==> [1/4] maps/ ya existe, saltando mapextractor."
        else
          echo "==> [1/4] Extrayendo Maps y DBC desde el cliente..."
          cd /workspace
          $$BINS/mapextractor -o /data
          echo "==> [1/4] Maps y DBC extraídos correctamente."
        fi

        # ── Step 2: VMap extraction (raw Buildings) ─
        if [ -d "/data/vmaps" ] && [ "$$(ls -A /data/vmaps 2>/dev/null)" ]; then
          echo "==> [2/4] vmaps/ ya existe, saltando vmap4extractor + assembler."
        else
          echo "==> [2/4] Extrayendo VMaps (datos crudos) desde el cliente..."
          cd /workspace
          $$BINS/vmap4extractor
          echo "==> [2/4] Datos VMap crudos extraídos (Buildings/)."

          # ── Step 3: VMap assembly ───────────────────
          echo "==> [3/4] Ensamblando VMaps finales..."
          mkdir -p /data/vmaps
          $$BINS/vmap4assembler /workspace/Buildings /data/vmaps
          echo "==> [3/4] VMaps ensamblados correctamente."
        fi

        # ── Step 4: MMaps generation ────────────────
        if [ -d "/data/mmaps" ] && [ "$$(ls -A /data/mmaps 2>/dev/null)" ]; then
          echo "==> [4/4] mmaps/ ya existe, saltando mmaps_generator."
        else
          echo "==> [4/4] Generando Movement Maps (esto puede tardar VARIAS HORAS)..."
          mkdir -p /data/mmaps
          cd /data
          $$BINS/mmaps_generator
          echo "==> [4/4] MMaps generados correctamente."
        fi

        echo "=========================================="
        echo "  ¡Extracción completa finalizada!"
        echo "  Archivos en: data/server/game-data/"
        echo "    - dbc/   : Data files"
        echo "    - maps/  : World maps"
        echo "    - vmaps/ : Visual maps"
        echo "    - mmaps/ : Movement maps"
        echo "=========================================="

  authserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-authserver
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      AUTH_DB: auth

    volumes:
      - ./config:/opt/skyfire-server/etc
      - ./data/server/logs:/opt/skyfire-server/logs

    ports:
      - "3724:3724"

    networks:
      - skyfire

    command: ["authserver"]

  worldserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-worldserver
    restart: unless-stopped

    stdin_open: true
    tty: true

    depends_on:
      mysql:
        condition: service_healthy
      authserver:
        condition: service_started

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      AUTH_DB: auth
      WORLD_DB: world
      CHARACTERS_DB: characters
      DATA_DIR: /opt/skyfire-server/data
      LOGS_DIR: /opt/skyfire-server/logs

    volumes:
      - ./config:/opt/skyfire-server/etc
      - ${GAME_DATA_PATH:-./data/server/game-data}:/opt/skyfire-server/data:ro
      - ./data/server/logs:/opt/skyfire-server/logs

    ports:
      - "8085:8085"

    networks:
      - skyfire

    command: ["worldserver"]

networks:
  skyfire:
    name: skyfire-network

volumes:
  mysql_data:
    name: skyfire-mysql-data
  db_cache:
    name: skyfire-db-cache
  extractor_workspace:
    name: skyfire-extractor-workspace
