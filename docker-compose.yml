services:
  mysql:
    image: mysql:8.4
    container_name: skyfire-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: auth
      MYSQL_USER: ${SKYFIRE_DB_USER:-skyfire}
      MYSQL_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}

    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    networks:
      - skyfire

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  db-init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-db-init
    restart: "no"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      REALM_NAME: ${REALM_NAME:-SkyFire 5.4.8}
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      REALM_PORT: ${REALM_PORT:-8085}
      SKYFIRE_REF: ${SKYFIRE_REF:-main}
      SFDB_DOWNLOAD_URL: ${SFDB_DOWNLOAD_URL:-}

    volumes:
      - ./scripts:/scripts:ro
      - db_cache:/database_cache
      - ./database:/local_sql:ro

    networks:
      - skyfire

    entrypoint: ["/bin/bash", "/scripts/db-init.sh"]

  extractor:
    profiles: ["tools"]
    image: skyfire548-server:latest
    container_name: skyfire-extractor
    volumes:
      - "${CLIENT_PATH:-D:/MoP/MOP-5.4.8.18414-enUS-Repack}:/client:ro"
      - "${GAME_DATA_PATH:-./data/server/game-data}:/data"
      - extractor_workspace:/workspace
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BINS=/opt/skyfire-server/bin

        echo "=========================================="
        echo "  SkyFire 5.4.8 — Extracción de Datos"
        echo "=========================================="

        # ── Paso 1: Maps y DBC ──────────────────────
        if [ -d "/data/maps" ] && [ "$$(ls -A /data/maps 2>/dev/null)" ] && [ -d "/data/dbc" ] && [ "$$(ls -A /data/dbc 2>/dev/null)" ]; then
          echo "==> [1/3] Maps y DBC ya existen en destino. Saltando mapextractor."
        else
          echo "==> [1/3] Extrayendo Maps y DBC desde el cliente..."
          cd /client
          $$BINS/mapextractor -o /data
          echo "==> [1/3] Maps y DBC extraídos correctamente."
        fi

        # ── Paso 2: VMaps 5.3 (vmap4extractor + vmap4assembler) ─
        if [ -f "/data/vmaps/0000.vmtree" ] && grep -q "VMAP_5.3" "/data/vmaps/0000.vmtree" 2>/dev/null; then
          echo "==> [2/3] VMaps 5.3 ya están presentes y son compatibles. Saltando extracción de vmaps."
        else
          echo "==> [2/3] Extrayendo y ensamblando VMaps versión 5.3 (esto toma 15-25 min)..."
          rm -rf /workspace/vmap_build
          mkdir -p /workspace/vmap_build
          cd /workspace/vmap_build
          echo "    -> Extrayendo geometría desde /client/Data..."
          $$BINS/vmap4extractor -d /client/Data
          echo "    -> Ensamblando VMaps 5.3 hacia /data/vmaps..."
          mkdir -p /data/vmaps
          $$BINS/vmap4assembler /workspace/vmap_build/Buildings /data/vmaps
          rm -rf /workspace/vmap_build
          echo "==> [2/3] ¡VMaps 5.3 ensamblados exitosamente!"
        fi

        # ── Paso 3: MMaps (si no existen) ───────────
        if [ -d "/data/mmaps" ] && [ "$$(ls -A /data/mmaps 2>/dev/null)" ]; then
          echo "==> [3/3] mmaps/ ya existe en destino. Saltando mmaps_generator."
        else
          echo "==> [3/3] Generando Movement Maps (mmaps)..."
          mkdir -p /data/mmaps
          cd /data
          $$BINS/mmaps_generator
          echo "==> [3/3] MMaps generados correctamente."
        fi

        echo "=========================================="
        echo "  ¡Proceso de datos completado!"
        echo "  Archivos listos en tu carpeta de mapas."
        echo "=========================================="

  authserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-authserver
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      AUTH_DB: auth

    volumes:
      - ./config:/opt/skyfire-server/etc
      - ./data/server/logs:/opt/skyfire-server/logs
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro

    ports:
      - "3724:3724"

    networks:
      - skyfire

    command: ["authserver"]

  worldserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyfire548-server:latest
    container_name: skyfire-worldserver
    restart: unless-stopped

    stdin_open: true
    tty: true

    depends_on:
      mysql:
        condition: service_healthy
      authserver:
        condition: service_started

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SKYFIRE_DB_USER: ${SKYFIRE_DB_USER:-skyfire}
      SKYFIRE_DB_PASSWORD: ${SKYFIRE_DB_PASSWORD:?Set SKYFIRE_DB_PASSWORD in .env}
      AUTH_DB: auth
      WORLD_DB: world
      CHARACTERS_DB: characters
      DATA_DIR: /opt/skyfire-server/data
      LOGS_DIR: /opt/skyfire-server/logs

    volumes:
      - ./config:/opt/skyfire-server/etc
      - ${GAME_DATA_PATH:-./data/server/game-data}:/opt/skyfire-server/data:ro
      - ./data/server/logs:/opt/skyfire-server/logs
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro

    ports:
      - "8085:8085"

    networks:
      - skyfire

    command: ["worldserver"]

networks:
  skyfire:
    name: skyfire-network

volumes:
  mysql_data:
    name: skyfire-mysql-data
  db_cache:
    name: skyfire-db-cache
  extractor_workspace:
    name: skyfire-extractor-workspace
